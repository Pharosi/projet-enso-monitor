# Intégration continue : à chaque pull request et à chaque fusion sur develop ou main,
# GitHub vérifie automatiquement la qualité du code et exécute tous les tests.
# Une pull request dont la vérification échoue ne doit pas être fusionnée.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Une nouvelle exécution sur la même branche annule la précédente (inutile de finir l'ancienne).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # lecture seule : la CI ne modifie jamais le dépôt

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Une vraie base PostgreSQL, identique à celle du développement.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enso
          POSTGRES_PASSWORD: mot-de-passe-ci
          POSTGRES_DB: enso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enso -d enso"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Base jetable de la CI : ce mot de passe ne protège rien et n'est utilisé nulle part ailleurs.
      URL_BASE_DE_DONNEES: postgresql+psycopg://enso:mot-de-passe-ci@localhost:5432/enso

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Analyse statique (ruff)
        run: ruff check .
      - name: Formatage (ruff format)
        run: ruff format --check .
      - name: Migrations Alembic (application et cohérence avec les modèles)
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (pytest)
        run: pytest -v

  frontend:
    name: Frontend (lint, formatage, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances (versions exactes du package-lock)
        run: npm ci
      - name: Analyse statique (oxlint)
        run: npm run lint
      - name: Formatage (Prettier)
        run: npm run format:check
      - name: Tests (Vitest)
        run: npm test
      - name: Vérification des types et build de production
        run: npm run build
