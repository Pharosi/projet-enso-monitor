[project]
name = "enso-monitor"
version = "1.0.0"
description = "API et ETL de la plateforme ENSO Monitor (indice ONI de la NOAA)"
requires-python = ">=3.13"
# Bornes : version testée minimale, majeure suivante exclue (évite une rupture d'API).
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pandas>=3.1,<4",
    "numpy>=2.5,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Avertissement interne de Starlette (TestClient), sans effet sur nos tests.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, UP : syntaxe Python moderne, B : bugs fréquents
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Les migrations générées contiennent de longues chaînes SQL (contraintes CHECK).
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# Le dossier local alembic/ ferait croire que la bibliothèque alembic est interne.
known-first-party = ["enso"]
known-third-party = ["alembic"]
